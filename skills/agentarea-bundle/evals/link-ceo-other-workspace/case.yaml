schema_version: "1.1"
name: link-ceo-other-workspace
expected_outcome: |
  Explains that bundle delegates only reach agents in the same bundle, so the link is an A2A delegate: a key bound to the CEO agent issued in the other workspace, stored as a secret in the calling workspace, and an agent tool with a2a_url and auth_secret_name; notes the full tools list is replaced on PATCH, admin rights, that the link lives outside the folder so it should be scripted and re-checked after redeploys, and that the CEO should be read-only for these questions; asks before issuing keys or creating secrets and never puts the key in the folder or chat.
